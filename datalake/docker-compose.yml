services:
  # 1. MinIO
  minio:
    image: minio/minio:latest
    container_name: minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks: [datalake-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s

  # 1-1. MinIO 버킷 자동 생성 (warehouse)
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio: { condition: service_healthy }
    networks: [datalake-network]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p local/warehouse || true
        echo "warehouse bucket ready"

  # 2-1. HMS 백엔드 DB (PostgreSQL)
  hms-postgres:
    image: postgres:15
    container_name: hms-postgres
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - hms-postgres-data:/var/lib/postgresql/data
    networks: [datalake-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2-2. HMS 추가 jar 다운로드 (postgres JDBC + hadoop-aws + aws-sdk)
  hms-libs:
    image: curlimages/curl:latest
    container_name: hms-libs
    user: root
    volumes:
      - hms-extra-libs:/libs
    networks: [datalake-network]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /libs
        echo "Downloading PostgreSQL JDBC driver..."
        [ -f postgresql-42.7.3.jar ] || curl -fsSL -o postgresql-42.7.3.jar \
          https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar
        echo "Downloading hadoop-aws..."
        [ -f hadoop-aws-3.3.6.jar ] || curl -fsSL -o hadoop-aws-3.3.6.jar \
          https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.6/hadoop-aws-3.3.6.jar
        echo "Downloading aws-java-sdk-bundle..."
        [ -f aws-java-sdk-bundle-1.12.367.jar ] || curl -fsSL -o aws-java-sdk-bundle-1.12.367.jar \
          https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.367/aws-java-sdk-bundle-1.12.367.jar
        chmod 644 *.jar
        # hive 컨테이너의 hive 사용자(uid=1000)가 읽을 수 있도록 소유자 변경
        chown -R 1000:1000 /libs
        ls -la /libs
        echo "All HMS libs ready"

  # 2-3. Hive Metastore
  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    ports: ["9083:9083"]
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hms-postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.warehouse.dir=s3a://warehouse/
    volumes:
      - hms-warehouse:/opt/hive/data/warehouse
      - hms-extra-libs:/opt/hive/auxlib:ro
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    networks: [datalake-network]
    depends_on:
      hms-postgres: { condition: service_healthy }
      hms-libs: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    healthcheck:
      # test: ["CMD-SHELL", "bash -c 'cat < /dev/tcp/localhost/9083' >/dev/null 2>&1"]
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9083'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # 3. Kudu Master
  kudu-master:
    image: apache/kudu:latest
    container_name: kudu-master
    user: root
    ports: ["8050:8051", "7050:7050"]   # 8051: Web UI, 7050: RPC
    volumes:
      - kudu-master-data:/var/lib/kudu/master
    command: ["master"]
    environment:
      MASTER_ARGS: >-
        --unlock_unsafe_flags
        --use_hybrid_clock=false
        --fs_wal_dir=/var/lib/kudu/master
        --rpc_bind_addresses=0.0.0.0:7050
        --rpc_advertised_addresses=kudu-master:7050
    networks: [datalake-network]

  # 4. Kudu Tablet Server
  kudu-tserver:
    image: apache/kudu:latest
    container_name: kudu-tserver
    user: root
    ports: ["8051:8051", "7051:7051"]
    volumes:
      - kudu-tserver-data:/var/lib/kudu/tserver
    command: ["tserver"]
    environment:
      TSERVER_ARGS: >-
        --unlock_unsafe_flags
        --use_hybrid_clock=false
        --tserver_master_addrs=kudu-master:7050
        --fs_wal_dir=/var/lib/kudu/tserver
        --rpc_bind_addresses=0.0.0.0:7051
        --rpc_advertised_addresses=kudu-tserver:7051
    depends_on: [kudu-master]
    networks: [datalake-network]

  # 5. StarRocks FE
  starrocks-fe:
    image: starrocks/fe-ubuntu:latest
    container_name: starrocks-fe
    entrypoint: /opt/starrocks/fe/bin/start_fe.sh
    ports: ["8030:8030", "9020:9020", "9030:9030"]
    volumes:
      - starrocks-fe-meta:/opt/starrocks/fe/meta
      - ./fe.conf:/opt/starrocks/fe/conf/fe.conf
    environment: # ✨ 여기에 네트워크 대역 설정을 추가합니다!
      - priority_networks=172.18.0.0/16
    networks: [datalake-network]
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW FRONTENDS' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 6. StarRocks BE
  starrocks-be:
    image: starrocks/be-ubuntu:latest
    container_name: starrocks-be
    entrypoint: /opt/starrocks/be/bin/start_be.sh
    ports: ["8040:8040", "9050:9050"]
    volumes:
      - starrocks-be-storage:/opt/starrocks/be/storage
    environment: # ✨ BE에도 동일하게 추가합니다!
      - priority_networks=172.18.0.0/16
    ulimits:
      memlock: -1
      nproc: 65535
      nofile: { soft: 65535, hard: 65535 }
    depends_on:
      starrocks-fe: { condition: service_healthy }
    networks: [datalake-network]

  # 6-1. StarRocks BE 자동 등록 (init 컨테이너)
  starrocks-init:
    image: starrocks/fe-ubuntu:latest
    container_name: starrocks-init
    depends_on:
      starrocks-fe: { condition: service_healthy }
      starrocks-be: { condition: service_started }
    networks: [datalake-network]
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for BE to be ready..."
        sleep 10
        
        # BE가 이미 등록되어 있는지 확인
        EXISTING=$$(mysql -h starrocks-fe -P 9030 -u root -N -e "SHOW BACKENDS" 2>/dev/null | grep -c "starrocks-be")
        
        if [ "$$EXISTING" -gt 0 ]; then
          echo "BE already registered, skipping."
        else
          echo "Registering BE..."
          mysql -h starrocks-fe -P 9030 -u root -e "ALTER SYSTEM ADD BACKEND 'starrocks-be:9050';"
          echo "BE registered successfully."
        fi
        
        # BE가 Alive 될 때까지 대기
        for i in $$(seq 1 30); do
          ALIVE=$$(mysql -h starrocks-fe -P 9030 -u root -N -e "SHOW BACKENDS" 2>/dev/null | grep -c "true")
          if [ "$$ALIVE" -gt 0 ]; then
            echo "BE is alive!"
            exit 0
          fi
          echo "Waiting for BE to become alive... ($$i/30)"
          sleep 3
        done
        echo "WARNING: BE did not become alive within timeout"

  # 7. Apache Spark Standalone Master
  spark:
    image: apache/spark:3.5.0
    container_name: spark
    hostname: spark
    user: root
    ports: ["8080:8080", "7077:7077"]
    environment:
      - SPARK_NO_DAEMONIZE=true
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    networks: [datalake-network]

  # 7-1. Spark Standalone Worker #1
  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    hostname: spark-worker-1
    user: root
    ports: ["8081:8081"]   # Worker #1 Web UI
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=16g
      - SPARK_WORKER_CORES=8
    volumes:
      - ./data:/opt/spark/data
      - spark-ivy-cache:/root/.ivy2
    entrypoint: ["/opt/spark/bin/spark-class",
                 "org.apache.spark.deploy.worker.Worker",
                 "spark://spark:7077"]
    depends_on:
      spark: { condition: service_started }
    networks: [datalake-network]

  # 7-2. Spark Standalone Worker #2
  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    hostname: spark-worker-2
    user: root
    ports: ["8082:8081"]   # Worker #2 Web UI (host 8082 → container 8081)
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=16g
      - SPARK_WORKER_CORES=8
    volumes:
      - ./data:/opt/spark/data
      - spark-ivy-cache:/root/.ivy2
    entrypoint: ["/opt/spark/bin/spark-class",
                 "org.apache.spark.deploy.worker.Worker",
                 "spark://spark:7077"]
    depends_on:
      spark: { condition: service_started }
    networks: [datalake-network]

  # 7-3. Spark Connect Server (Standalone Master에 연결)
  spark-connect:
    image: apache/spark:3.5.0
    container_name: spark-connect
    hostname: spark-connect
    user: root
    ports:
      - "15002:15002"
      - "4040:4040"   # ← Web UI
    volumes:
      # 1. Jar 파일 캐싱: 패키지 재다운로드 방지 (속도 향상)
      - spark-ivy-cache:/root/.ivy2
      # 2. 데이터 공유: 로컬의 CSV 파일 등을 컨테이너 내에서 참조할 경우
      - ./data:/opt/spark/data
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_DRIVER_MEMORY=4g
      - SPARK_EXECUTOR_MEMORY=8g
      - _JAVA_OPTIONS=-Xmx2g
    networks: [datalake-network]
    depends_on:
      spark: { condition: service_started }
      spark-worker-1: { condition: service_started }
      spark-worker-2: { condition: service_started }
      hive-metastore: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: >
      /opt/spark/sbin/start-connect-server.sh
      --master spark://spark:7077
      --packages org.apache.spark:spark-connect_2.12:3.5.0,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.0,org.apache.iceberg:iceberg-aws-bundle:1.5.0,org.apache.hadoop:hadoop-aws:3.3.4
      --conf spark.jars.repositories=https://repo1.maven.org/maven2
      --conf spark.driver.host=spark-connect
      --conf spark.driver.bindAddress=0.0.0.0
      --conf spark.sql.catalog.hive=org.apache.iceberg.spark.SparkCatalog
      --conf spark.sql.catalog.hive.type=hive
      --conf spark.sql.catalog.hive.uri=thrift://hive-metastore:9083
      --conf spark.sql.catalog.hive.warehouse=s3a://warehouse/
      --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
      --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
      --conf spark.hadoop.fs.s3a.access.key=minioadmin
      --conf spark.hadoop.fs.s3a.secret.key=minioadmin
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem

  # =========================================================
  # 8. Airflow 공통 설정 (x-airflow-common anchor)
  # =========================================================
  # --- Airflow 백엔드 DB (PostgreSQL) ---
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    networks: [datalake-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Airflow 메시지 브로커 (Redis) ---
  airflow-redis:
    image: redis:7-alpine
    container_name: airflow-redis
    ports: ["6379:6379"]
    networks: [datalake-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Airflow DB init & admin user ---
  # Airflow 3.x Simple Auth Manager:
  #   패스워드 파일: $AIRFLOW_HOME/simple_auth_manager_passwords.json.generated
  #   형식: {"username": "plaintext_password"}
  #   airflow-home 볼륨으로 api-server 등과 파일 공유
  airflow-init:
    image: apache/airflow:3.1.1
    container_name: airflow-init
    user: "50000:0"
    depends_on:
      airflow-postgres: { condition: service_healthy }
      airflow-redis: { condition: service_healthy }
    networks: [datalake-network]
    restart: "no"
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags/current"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:Admin"
      AIRFLOW__SIMPLE_AUTH_MANAGER__USERS: "admin:Admin"
      AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS: "admin:admin"
    volumes:
      - dag-sync:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow-home:/opt/airflow
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        printf '{"admin": "admin"}' > /opt/airflow/simple_auth_manager_passwords.json.generated
        echo "Password file written:"
        cat /opt/airflow/simple_auth_manager_passwords.json.generated
        echo ""
        echo "Airflow 3.1.1 init complete"

  # --- Airflow API Server (3.x: webserver → api-server) ---
  # Airflow 3.x에서 웹서버가 'api-server' 컴포넌트로 분리됨
  airflow-api-server:
    image: apache/airflow:3.1.1
    container_name: airflow-api-server
    ports: ["8888:8080"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    networks: [datalake-network]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags/current"
      AIRFLOW__SIMPLE_AUTH_MANAGER__USERS: "admin:Admin"
      AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS: "admin:admin"
      AIRFLOW__API__EXPOSE_CONFIG: "true"
      SPARK_CONNECT_URL: "sc://spark-connect:15002"
    volumes:
      - dag-sync:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow-home:/opt/airflow
    command: api-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # --- Airflow DAG Processor (3.x 신규: DAG 파일 파싱 전담) ---
  airflow-dag-processor:
    image: apache/airflow:3.1.1
    container_name: airflow-dag-processor
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    networks: [datalake-network]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags/current"
      AIRFLOW__SIMPLE_AUTH_MANAGER__USERS: "admin:Admin"
      AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS: "admin:admin"
    volumes:
      - dag-sync:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow-home:/opt/airflow
    command: dag-processor

  # --- Airflow Scheduler ---
  airflow-scheduler:
    image: apache/airflow:3.1.1
    container_name: airflow-scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      airflow-dag-processor: { condition: service_started }
    networks: [datalake-network]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags/current"
      AIRFLOW__SIMPLE_AUTH_MANAGER__USERS: "admin:Admin"
      AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS: "admin:admin"
      SPARK_CONNECT_URL: "sc://spark-connect:15002"
    volumes:
      - dag-sync:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow-home:/opt/airflow
    command: scheduler

  # --- Airflow Celery Worker ---
  airflow-worker:
    image: apache/airflow:3.1.1
    container_name: airflow-worker
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      airflow-redis: { condition: service_healthy }
    networks: [datalake-network]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags/current"
      AIRFLOW__SIMPLE_AUTH_MANAGER__USERS: "admin:Admin"
      AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS: "admin:admin"
      SPARK_CONNECT_URL: "sc://spark-connect:15002"
      # pyspark-connect 패키지가 worker 이미지에 필요
      _PIP_ADDITIONAL_REQUIREMENTS: "pyspark==3.5.0"
    volumes:
      - dag-sync:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/opt/spark/data   # 로컬 데이터 공유 (필요 시)
    command: celery worker

  # --- Airflow Triggerer (3.x: Deferrable Operator 지원) ---
  airflow-triggerer:
    image: apache/airflow:3.1.1
    container_name: airflow-triggerer
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    networks: [datalake-network]
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags/current"
      AIRFLOW__SIMPLE_AUTH_MANAGER__USERS: "admin:Admin"
      AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS: "admin:admin"
    volumes:
      - dag-sync:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow-home:/opt/airflow
    command: triggerer

  # ※ Flower는 Airflow 3.x에서 공식 제거되었습니다.
  #   Celery 워커 모니터링이 필요하면 별도로 mher/flower 이미지를 사용하세요.

  # =========================================================
  # 9. GitLab CE 18.11.4
  # =========================================================
  gitlab:
    image: gitlab/gitlab-ce:18.11.4-ce.0
    container_name: gitlab
    hostname: gitlab
    ports:
      - "8929:80"    # Web UI (HTTP)
      - "8443:443"   # Web UI (HTTPS)
      - "2222:22"    # SSH (git clone)
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab:80'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222

        # PostgreSQL 외부 연결 (전용 DB 사용)
        postgresql['enable'] = false
        gitlab_rails['db_adapter'] = 'postgresql'
        gitlab_rails['db_host'] = 'gitlab-postgres'
        gitlab_rails['db_port'] = 5432
        gitlab_rails['db_database'] = 'gitlab'
        gitlab_rails['db_username'] = 'gitlab'
        gitlab_rails['db_password'] = 'gitlab'

        # Redis 외부 연결 (전용 Redis 사용)
        redis['enable'] = false
        gitlab_rails['redis_host'] = 'gitlab-redis'
        gitlab_rails['redis_port'] = 6379

        # 메모리 최적화
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        gitlab_exporter['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
        # grafana is removed in GitLab 18.x

        # 초기 root 비밀번호
        gitlab_rails['initial_root_password'] = 'Password1234!'
        gitlab_rails['store_initial_root_password'] = true
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    networks: [datalake-network]
    depends_on:
      gitlab-postgres: { condition: service_healthy }
      gitlab-redis: { condition: service_healthy }
    shm_size: '256m'
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:80/-/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s   # GitLab 초기 기동은 최대 5분 소요

  # --- GitLab 전용 PostgreSQL ---
  gitlab-postgres:
    image: postgres:15
    container_name: gitlab-postgres
    environment:
      POSTGRES_USER: gitlab
      POSTGRES_PASSWORD: gitlab
      POSTGRES_DB: gitlab
    volumes:
      - gitlab-postgres-data:/var/lib/postgresql/data
    networks: [datalake-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitlab -d gitlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- GitLab 전용 Redis ---
  gitlab-redis:
    image: redis:7-alpine
    container_name: gitlab-redis
    volumes:
      - gitlab-redis-data:/data
    networks: [datalake-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================================================
  # 10. Git-Sync (GitLab → Airflow DAG 자동 동기화)
  # =========================================================
  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.2.1
    container_name: git-sync
    environment:
      GITSYNC_REPO: "http://gitlab/root/airflow-dags.git"
      GITSYNC_BRANCH: "main"
      GITSYNC_PERIOD: "30s"
      GITSYNC_ROOT: "/git"
      GITSYNC_LINK: "current"
      GITSYNC_USERNAME: "root"
      GITSYNC_PASSWORD: "glpat-SzZnF2X0VXhFlNYdRPyMP286MQp1OjEH.01.0w0bgpov9"
      GITSYNC_ONE_TIME: "false"
    volumes:
      - dag-sync:/git
    networks: [datalake-network]
    depends_on:
      gitlab: { condition: service_healthy }
    restart: unless-stopped


networks:
  datalake-network:
    name: datalake-network    # ← 추가. 언더스코어 제거
    driver: bridge

volumes:
  minio-data:
  kudu-master-data:
  kudu-tserver-data:
  starrocks-fe-meta:
  starrocks-be-storage:
  hms-postgres-data:    # 변경됨: nessie-data → hms-postgres-data
  hms-warehouse:        # 추가됨
  hms-extra-libs:       # 추가됨: HMS용 추가 jar 보관
  spark-ivy-cache:
  airflow-postgres-data:   # Airflow 메타데이터 DB
  airflow-home:            # $AIRFLOW_HOME 공유 (Simple Auth Manager 패스워드 파일 포함)
  dag-sync:                # git-sync → Airflow DAG 공유 볼륨
  gitlab-config:           # GitLab 설정
  gitlab-logs:             # GitLab 로그
  gitlab-data:             # GitLab 데이터 (저장소 등)
  gitlab-postgres-data:    # GitLab 전용 PostgreSQL
  gitlab-redis-data:       # GitLab 전용 Redis